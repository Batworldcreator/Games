<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Zona Gamer - Juegos IO</title>
    <style>
        /* Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Barra de Navegación Principal */
        header {
            background-color: #1a1a1e;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00ff88;
        }

        header h1 {
            color: #00ff88;
            font-size: 24px;
        }

        /* Sección Principal (Hero) */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #1a1a1e 0%, #121214 100%);
        }

        .hero h2 {
            font-size: 32px;
        }

        /* Contenedor de la Lista de Juegos */
        .games-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Tarjeta de Juego Rediseñada con Imagen */
        .game-card {
            background-color: #1a1a1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a30;
            display: flex;
            flex-direction: row; /* Imagen a un lado e info al otro en pantallas grandes */
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
        }

        /* Contenedor de la foto de portada */
        .game-cover-box {
            width: 240px;
            min-width: 240px;
            height: 160px;
            overflow: hidden;
            background-color: #000;
        }

        .game-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la foto sin deformarla */
            transition: transform 0.3s;
        }

        .game-card:hover .game-cover-box img {
            transform: scale(1.05); /* Efecto zoom suave al pasar el ratón */
        }

        /* Contenedor del contenido (Texto y Botón) */
        .game-details {
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .game-info h3 {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .game-info p {
            color: #a0a0a5;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Botón de Jugar */
        .btn-play {
            background-color: #00ff88;
            color: #121214;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            white-space: nowrap; /* Evita que el texto del botón se rompa en dos líneas */
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play:hover {
            background-color: #00cc6e;
        }

        .btn-play:active {
            transform: scale(0.95);
        }

        /* Adaptación para pantallas pequeñas (Móviles / Tablets en vertical) */
        @media (max-width: 768px) {
            .game-card {
                flex-direction: column; /* Apila la foto arriba y el texto abajo */
            }
            .game-cover-box {
                width: 100%;
                height: 180px; /* Portada más ancha en móvil */
            }
            .game-details {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .btn-play {
                width: 100%;
                text-align: center;
            }
        }

        /* VISTA DEL JUEGO INDIVIDUAL */
        #game-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }
